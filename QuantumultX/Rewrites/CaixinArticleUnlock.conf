#!name = 财新文章及收听解锁（Surge 转 Quantumult X）
#!desc = 文章正文与收听权限、deepview 配置及 6 条广告 JSON 清空规则
#!author = 原模块作者（未署名） / QX 语法转换
#!homepage = https://caixin-surge.pages.dev/surge/caixin-unlock.sgmodule

# upstream_config: https://caixin-surge.pages.dev/surge/caixin-unlock.sgmodule
# upstream_script_article: https://caixin-surge.pages.dev/surge/caixin-article.js
# upstream_script_auth: https://caixin-surge.pages.dev/surge/caixin-vip.js
# upstream_script_audio: https://caixin-surge.pages.dev/surge/caixin-audio.js
# upstream_script_deepview: https://caixin-surge.pages.dev/surge/caixin-deepview.js
# source: user-supplied updated Surge module on 2026-11-18.
# JS runtimes were not independently tested on Loon / QX. This configuration directly references upstream JS.
# Source Surge [Map Local] uses HTTP 200 body {}; Loon/QX reject-dict is the closest supported equivalent.
# Source Surge script-update-interval=300 and per-rule max-size have no direct equivalent in these remote rules.
# qx_filter_raw: https://raw.githubusercontent.com/cuocuo/third/main/QuantumultX/Rewrites/CaixinArticleUnlock-Filter.list
# [rewrite_remote] import this file; separately import qx_filter_raw via [filter_remote].

# Surge Map Local -> QX reject-dict (HTTP 200, body {})
^https:\/\/cxdata\.caixin\.com\/api\/dataplus\/stkData\/list url reject-dict
^https:\/\/entities\.caixin\.com\/api\/public\/push\/appIndex\?(?:[^#?&]+&)*target=index url reject-dict
^https:\/\/gateway\.caixin\.com\/api\/app-api\/search\/getkeyword url reject-dict
^https:\/\/gateway\.caixin\.com\/api\/app-api\/caixinminiapp\/appinfo url reject-dict
^https:\/\/gateway\.caixin\.com\/api\/app-api\/articlesHotRecommend\/getHotRecommendArticles url reject-dict
^https:\/\/www\.caixin\.com\/ai\/question.+ url reject-dict

# Surge response scripts
^https:\/\/mappsv5\.caixin\.com\/articlev5\/\d+\/\d+\.html url script-response-body https://caixin-surge.pages.dev/surge/caixin-article.js
^https:\/\/mini\.caixin\.com\/(m\/)?\d{4}-\d{2}-\d{2}\/\d+\.html url script-response-body https://caixin-surge.pages.dev/surge/caixin-article.js
^https:\/\/gateway\.caixin\.com\/api\/app-api\/auth\/newValidate$ url script-response-body https://caixin-surge.pages.dev/surge/caixin-vip.js
^https:\/\/gateway\.caixin\.com\/api\/app-api\/auth\/validateAudioAuth$ url script-response-body https://caixin-surge.pages.dev/surge/caixin-audio.js
^https:\/\/deepview-dynamic\.caixin\.com\/api\/topic\/config\/(event|topic)\/ url script-response-body https://caixin-surge.pages.dev/surge/caixin-deepview.js

hostname = mappsv5.caixin.com, gateway.caixin.com, mini.caixin.com, cxdata.caixin.com, entities.caixin.com, www.caixin.com, deepview-dynamic.caixin.com
